# ── Rate limiting ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# ── HTTP — redirect to HTTPS ───────────────────────────
server {
    listen 80;
    server_name optimuminnovationhotspot.com www.optimuminnovationhotspot.com;

    # Certbot SSL challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name optimuminnovationhotspot.com www.optimuminnovationhotspot.com;

    # ── SSL Certificates ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/optimuminnovationhotspot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimuminnovationhotspot.com/privkey.pem;

    # ── SSL Settings ──────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Security Headers ──────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "same-origin"     always;

    # ── Static Files ──────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media Files ───────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── Portal (landing page) — rate limited ──────────
    location = / {
        limit_req zone=portal burst=10 nodelay;
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Payment API — rate limited ────────────────────
    location /payments/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Dashboard — rate limited ──────────────────────
    location /dashboard/ {
        limit_req zone=dashboard burst=15 nodelay;
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Everything else ───────────────────────────────
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }
}
